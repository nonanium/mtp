[package]
name = "mtp-h3"
version.workspace = true
edition.workspace = true

[dependencies]
mtp-common.workspace = true
mtp-core.workspace = true
async-trait = "0.1"
bytes = "1"
h3 = "0.0.8"
h3-quinn = { version = "0.0.10", features = ["datagram"] }
h3-webtransport = "0.1.2"
quinn = "0.11"
tokio = { version = "1", features = ["io-util", "time"] }
tracing = "0.1"

[features]
default = []
crypto = []
pipes = ["mtp-core/pipes"]
