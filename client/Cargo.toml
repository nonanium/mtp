[package]
name = "mtp-client"
version.workspace = true
edition.workspace = true

[dependencies]
mtp-common.workspace = true
mtp-codec = { workspace = true, features = ["registry"] }
mtp-native.workspace = true
mtp-crypto = { workspace = true, optional = true }
rand = "0.10.1"
tokio = { version = "1", features = ["rt", "sync", "time"] }

[dev-dependencies]
mtp-host.workspace = true
mtp-native = { workspace = true, features = ["host"] }
rcgen = "0.14"

[features]
crypto = ["dep:mtp-crypto", "mtp-codec/crypto"]
pipes = ["mtp-common/pipes", "mtp-native/pipes"]
