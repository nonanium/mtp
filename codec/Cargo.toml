[package]
name = "mtp-codec"
version = "0.1.0"
edition = "2024"

[dependencies]
mtp-type-map = { path = "../type-map" }
mtp-common = { path = "../common" }
mtp-crypto = { path = "../crypto", optional = true }
base64 = "0.22"
byteorder = "1.5"
rand = { version = "0.8", features = ["std", "std_rng"] }

[features]
default = []
registry = ["mtp-type-map/registry"]
crypto = ["dep:mtp-crypto", "mtp-crypto/mlkem-tls"]
