[package]
name = "mtp-codec"
version = "0.1.0"
edition = "2024"

[dependencies]
mtp-type-map = { path = "../type-map" }
mtp-common = { path = "../common" }
mtp-crypto = { path = "../crypto", optional = true }
registry = { path = "../registry", optional = true }
base64 = "*"
byteorder = "*"
rand = { version = "*", features = ["std", "std_rng"] }

[features]
default = []
registry = ["dep:registry"]
crypto = ["dep:mtp-crypto"]
