[package]
name = "mtp-codec"
version.workspace = true
edition.workspace = true

[dependencies]
mtp-type-map.workspace = true
mtp-common.workspace = true
mtp-crypto = { workspace = true, optional = true }
base64 = "0.23"
byteorder = "1.5"
rand = { version = "0.10.1", features = ["std", "std_rng"] }
thiserror = "2.0.18"

[features]
registry = ["mtp-type-map/registry"]
crypto = ["dep:mtp-crypto", "mtp-crypto/mlkem-tls"]
pipes = ["mtp-type-map/pipes"]
