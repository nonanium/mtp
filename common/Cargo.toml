[package]
name = "mtp-common"
version = "0.2.0"
edition = "2024"

[dependencies]
thiserror = "2.0.18"

[features]
pipes = []

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wtransport = { version = "0.7.1", default-features = false, features = [
    "aws-lc-rs",
    "quinn",
    "self-signed",
] }
rustls = { version = "0.23.41" }
quinn = { version = "0.11.11", default-features = false, features = [
    "rustls-aws-lc-rs",
    "rustls",
] }
