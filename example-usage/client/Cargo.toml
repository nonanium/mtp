[package]
name = "mtp-example-client"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mtp-example-client"
path = "src/main.rs"

[dependencies]
mtp-client = { path = "../../client", features = ["crypto"] }
mtp-codec = { path = "../../codec" }
mtp-crypto = { path = "../../crypto" }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
hex = "0.4"
