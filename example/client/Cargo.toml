[package]
name = "client"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "client"
path = "src/main.rs"

[dependencies]
mtp = { version = "0.2.0", path = "../../", features = ["client", "crypto", "files", "pipes"] }
tokio = { version = "1", features = ["full"] }
rand = "0.10.1"
tracing-subscriber = "0.3.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
