[package]
name = "mtp-files"
version = "0.1.0"
edition = "2024"

[dependencies]
# Only the plain key types (`Keyring`, `PublicKeyBundle`, `CryptoError`) are
# needed here; those are always compiled, so no crypto features are required.
mtp-crypto = { version = "0.1.0", path = "../crypto", default-features = false }
thiserror = "1"
