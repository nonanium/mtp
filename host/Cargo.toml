[package]
name = "mtp-host"
version.workspace = true
edition.workspace = true

[dependencies]
mtp-common.workspace = true
mtp-core.workspace = true
mtp-pipes = { workspace = true, optional = true }
mtp-codec = { workspace = true, features = ["registry"] }
mtp-native = { workspace = true, features = ["host"] }
mtp-crypto = { workspace = true, optional = true }
rand = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "time", "sync"] }
tracing = "0.1"

[features]

crypto = ["dep:mtp-crypto", "mtp-codec/crypto"]

pipes = ["dep:mtp-pipes", "mtp-common/pipes", "mtp-native/pipes"]
