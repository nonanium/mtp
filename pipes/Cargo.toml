[package]
name = "mtp-pipes"
version.workspace = true
edition.workspace = true

[dependencies]
mtp-common = { workspace = true, features = ["pipes"] }
mtp-codec = { workspace = true, features = ["pipes"] }
mtp-core = { workspace = true, features = ["pipes"] }
mtp-crypto = { workspace = true, optional = true }
rand = { version = "0.10.2", optional = true }
zeroize = { version = "1.9", optional = true }
tokio = { version = "1", features = ["io-util", "rt", "sync", "time"] }
tracing = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio_with_wasm = { version = "0.10.1", features = ["rt", "sync", "time", "macros", "io-util"] }

[features]
encrypted = ["mtp-codec/crypto", "dep:mtp-crypto", "dep:rand", "dep:zeroize"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
