[package]
name = "server"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
mtp = { path = "../../../..", features = ["crypto", "tls", "web-server", "files", "pipes", "raw"] }
tokio = { version = "1", features = ["full"] }
http = "1"
serde_json = { version = "1" }
hex = "0.4"
base64 = "0.23"
tracing-subscriber = "0.3.23"
serde = { version = "1", features = ["derive"] }
rand = "0.10.1"
